name: GuolemeAI
options:
  bundleIdPrefix: com.interviewteleprompter
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0.3"
  CURRENT_PROJECT_VERSION: "4"
targets:
  GuolemeAI:
    type: application
    platform: iOS
    sources:
      - GuolemeAI
    resources:
      - GuolemeAI/Assets.xcassets
      - GuolemeAI/PrivacyInfo.xcprivacy
    info:
      path: GuolemeAI/Info.plist
    entitlements:
      path: GuolemeAI/GuolemeAI.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.interviewteleprompter.guoleme
      INFOPLIST_KEY_CFBundleDisplayName: 过了么AI
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: GuolemeAILiveActivity
        embed: true
      - sdk: ActivityKit.framework
      - sdk: AVFoundation.framework
      - sdk: PDFKit.framework
    preBuildScripts:
      - name: Copy Shared Prompts
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/prompts"
          cp -R "${SRCROOT}/../../shared/prompts/." "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/prompts/"
  GuolemeAILiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - GuolemeAILiveActivity
      - path: GuolemeAI/LiveActivity/ListeningAttributes.swift
    info:
      path: GuolemeAILiveActivity/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.interviewteleprompter.guoleme.LiveActivity
      APPLICATION_EXTENSION_API_ONLY: YES
      SKIP_INSTALL: YES
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
