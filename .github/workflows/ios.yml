name: iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "shared/prompts/**"
      - ".github/workflows/ios.yml"

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Strip Live Activity for sideload
        run: python3 ios/scripts/prepare-sideload-build.py

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/GuolemeAI/GuolemeAI.xcodeproj \
            -scheme GuolemeAI \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GuolemeAI.app"
          test -d "$APP"
          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qr GuolemeAI.ipa Payload)
          mkdir -p dist
          mv "$STAGE/GuolemeAI.ipa" dist/GuolemeAI.ipa
          ls -lh dist/GuolemeAI.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GuolemeAI-ipa
          path: dist/GuolemeAI.ipa
          if-no-files-found: error
